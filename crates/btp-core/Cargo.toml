[package]
name = "btp-core"
version = "0.5.0"
edition.workspace = true
license.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "1.1"
dirs = "7"
fs4 = { version = "1.1.0", features = ["sync"] }
serde_json = "1.0.154"
libc = "0.2.191"

[target.'cfg(target_os = "macos")'.dependencies]
libproc = "0.14.11"

[features]
# Exposes `platform::FakePlatform` to other crates and integration tests.
fake = []

[dev-dependencies]
tempfile = "3"
