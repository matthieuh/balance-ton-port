# Generates BalanceTonPort.xcodeproj (git-ignored):
#   ../scripts/build-xcframework.sh   # Rust core + Swift bindings first
#   xcodegen generate                 # from this directory
# Tests (pure helpers + Rust core, no app host; the CLI check wants target/debug/btp):
#   xcodebuild -project BalanceTonPort.xcodeproj -scheme BalanceTonPort test
name: BalanceTonPort
options:
  bundleIdPrefix: com.matthieuh
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "14.0"
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    # exactVersion is the lock: Package.resolved lives in the generated project.
    exactVersion: 2.10.0
targets:
  BalanceTonPort:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Assets.xcassets
    dependencies:
      - framework: Frameworks/BtpCore.xcframework
        embed: false
      - package: Sparkle
    info:
      path: Info.plist
      properties:
        CFBundleName: Balance ton port
        CFBundleDisplayName: Balance ton port
        CFBundleShortVersionString: "0.4.5"
        CFBundleVersion: "9"
        LSUIElement: true
        LSMinimumSystemVersion: "14.0"
        NSHumanReadableCopyright: ""
        SUFeedURL: https://github.com/matthieuh/balance-ton-port/releases/latest/download/appcast.xml
        SUPublicEDKey: GMOe9MiovBuX8INutMlSoqZFrBeHWKR2tg2RH2rb8yE=
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
        SUAutomaticallyUpdate: true
        SUEnableSystemProfiling: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.matthieuh.balancetonport
        PRODUCT_NAME: Balance ton port
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: false
        ENABLE_HARDENED_RUNTIME: true
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        SWIFT_TREAT_WARNINGS_AS_ERRORS: true
  # Pure helpers (Sources/Logic.swift, Sources/Menu/MenuStyle.swift) plus the Rust core, no app host: the
  # tests never start the app, its watch passes or its notifications.
  BalanceTonPortTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
      - path: Sources/Logic.swift
      - path: Sources/MemoryPressure.swift
      - path: Sources/Copy.swift
      - path: Sources/Menu/MenuStyle.swift
      - path: Sources/Updates.swift
      - path: Sources/Language.swift
      - path: Sources/Localizable.xcstrings
      - path: Sources/Generated
    dependencies:
      - framework: Frameworks/BtpCore.xcframework
        embed: false
      - package: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.matthieuh.balancetonport.tests
        GENERATE_INFOPLIST_FILE: true
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        SWIFT_TREAT_WARNINGS_AS_ERRORS: true
  # The README screenshots: the real views, fed made-up servers, rendered
  # offscreen to PNG. Every app source but the entry point, no app host, so
  # nothing watches or stops a server. Run by ../scripts/screenshots.sh.
  BalanceTonPortScreenshots:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Screenshots
      - path: Sources
        excludes:
          - BalanceTonPortApp.swift
      - path: Assets.xcassets
    dependencies:
      - framework: Frameworks/BtpCore.xcframework
        embed: false
      - package: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.matthieuh.balancetonport.screenshots
        GENERATE_INFOPLIST_FILE: true
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        SWIFT_TREAT_WARNINGS_AS_ERRORS: true
schemes:
  BalanceTonPort:
    build:
      targets:
        BalanceTonPort: all
    test:
      targets:
        - BalanceTonPortTests
  Screenshots:
    build:
      targets:
        BalanceTonPortScreenshots: [test]
    test:
      targets:
        - BalanceTonPortScreenshots
