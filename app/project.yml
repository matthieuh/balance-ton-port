# Generates BalanceTonPort.xcodeproj (git-ignored):
#   ../scripts/build-xcframework.sh   # Rust core + Swift bindings first
#   xcodegen generate                 # from this directory
# Tests (pure helpers + Rust core, no app host; the CLI check wants target/debug/btp):
#   xcodebuild -project BalanceTonPort.xcodeproj -scheme BalanceTonPort test
name: BalanceTonPort
options:
  bundleIdPrefix: com.matthieuh
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "14.0"
targets:
  BalanceTonPort:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Assets.xcassets
    dependencies:
      - framework: Frameworks/BtpCore.xcframework
        embed: false
    info:
      path: Info.plist
      properties:
        CFBundleName: Balance ton port
        CFBundleDisplayName: Balance ton port
        CFBundleShortVersionString: "0.2.0"
        CFBundleVersion: "2"
        LSUIElement: true
        LSMinimumSystemVersion: "14.0"
        NSHumanReadableCopyright: ""
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.matthieuh.balancetonport
        PRODUCT_NAME: Balance ton port
        GENERATE_INFOPLIST_FILE: false
        ENABLE_HARDENED_RUNTIME: true
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        SWIFT_TREAT_WARNINGS_AS_ERRORS: true
  # Pure helpers (Sources/Logic.swift) plus the Rust core, no app host: the
  # tests never start the app, its watch passes or its notifications.
  BalanceTonPortTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
      - path: Sources/Logic.swift
      - path: Sources/Generated
    dependencies:
      - framework: Frameworks/BtpCore.xcframework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.matthieuh.balancetonport.tests
        GENERATE_INFOPLIST_FILE: true
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        SWIFT_TREAT_WARNINGS_AS_ERRORS: true
schemes:
  BalanceTonPort:
    build:
      targets:
        BalanceTonPort: all
    test:
      targets:
        - BalanceTonPortTests
