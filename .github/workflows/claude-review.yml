name: Claude review

# Automatic review of every PR opened from a branch of this repo, against the
# safety invariants in CLAUDE.md. Advisory: not a required check.
#
# Fork PRs are skipped (`pull_request` runs from forks get no secrets anyway);
# comment `@claude review this PR` on one to review it via claude.yml.
# Dependabot PRs are skipped: dependabot-automerge.yml handles them.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

permissions:
  contents: read

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: >-
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@61a9c274fa7110a66dfafc1bbbced03833eb25fe # v1.0.269
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          use_sticky_comment: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            EVENT: ${{ github.event.action }}

            Review this pull request. CLAUDE.md is the rubric: its "Safety
            invariants" and "Reviewing" sections say what matters here. This
            app sends SIGTERM and SIGKILL to processes, so a wrong decision
            kills a user's process.

            How to work:
            1. Read the diff with `gh pr diff` and the description with
               `gh pr view`. Read the surrounding code in the checkout, not
               just the diff: an invariant usually breaks through a caller or
               a path the diff does not show.
            2. On `synchronize`, read the review comments already posted
               (`gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments`)
               and do not repeat a point already made.
            3. Report only issues you can tie to a concrete failure: the
               inputs or state, and what goes wrong. No style nits: rustfmt
               and clippy -D warnings run in CI. No praise, no restating what
               the PR does.
            4. Post each issue as an inline comment on the exact line, opening
               with its severity: **[invariant]** (breaks a safety invariant),
               **[bug]**, **[test]** (a behavior change no test would catch),
               **[docs]** (README or French copy now wrong).
            5. Finish with one summary comment: one line per issue with its
               severity, or "No issues found." when there are none. Say which
               invariants the diff touches and whether tests cover them.
          claude_args: >-
            --model claude-opus-5-5
            --max-turns 60
            --allowedTools "Read,Grep,Glob,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments:*)"
