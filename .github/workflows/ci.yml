name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # macos-26 ships Xcode 26, the toolchain the app is developed and
    # validated with (Swift 6 language mode, strict concurrency). The older
    # macos-14 image defaults to Xcode 15, which cannot build Swift 6 targets.
    runs-on: macos-26
    env:
      MACOSX_DEPLOYMENT_TARGET: "14.0"
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Tests isolate themselves (BTP_DATA_DIR in a temp dir). CI never sets
      # CLAUDE_CONFIG_DIR; fail loudly if the runner image ever does.
      - name: No Claude env
        run: |
          if [ -n "${CLAUDE_CONFIG_DIR+x}" ]; then
            echo "::error::CLAUDE_CONFIG_DIR is set on the runner"
            exit 1
          fi

      - name: Rust toolchain (rust-toolchain.toml)
        run: |
          rustup toolchain install
          rustup component add rustfmt clippy
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          rustc --version
          cargo --version

      # libproc runs bindgen: point it at the SDK and Xcode's libclang (same as
      # scripts/build-xcframework.sh).
      - name: bindgen env
        run: |
          SDKROOT="$(xcrun --sdk macosx --show-sdk-path)"
          {
            echo "SDKROOT=$SDKROOT"
            echo "BINDGEN_EXTRA_CLANG_ARGS=-isysroot $SDKROOT"
            echo "LIBCLANG_PATH=$(xcode-select -p)/Toolchains/XcodeDefault.xctoolchain/usr/lib"
          } >> "$GITHUB_ENV"
          xcodebuild -version

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      # Also builds target/debug/btp, which the Swift tests call.
      - name: cargo test
        run: cargo test --locked

      - name: TEMP diagnostics
        if: failure()
        run: |
          which -a python3; python3 -V; echo "SHELL=$SHELL"
          export BTP_DATA_DIR="$RUNNER_TEMP/btpd" HOME="$RUNNER_TEMP/btph" BTP_TEST_FRAMEWORK="serve.py:8000:long" BTP_TEST_NO_CODEX=1
          mkdir -p "$BTP_DATA_DIR" "$HOME"
          (time python3 crates/btp-cli/tests/helpers/serve.py --port 20997 & sleep 8; kill %1) 2>&1 | head
          target/debug/btp run -- "$PWD/crates/btp-cli/tests/helpers/serve.py" --port 20998 > "$RUNNER_TEMP/o" 2>&1 < /dev/null &
          sleep 12
          echo "--- btp output"; cat "$RUNNER_TEMP/o"
          echo "--- ps"; ps -axo pid,ppid,stat,etime,command | grep -iE "python|serve|btp" | grep -v grep
          echo "--- logs dir"; ls -laR "$BTP_DATA_DIR" | head -40
          for f in $(find "$BTP_DATA_DIR" -name "*.log" | head -3); do echo "== $f"; head -20 "$f"; done
          echo "--- sample"; for p in $(pgrep -f "serve.py --port 20998"); do sample "$p" 1 2>/dev/null | grep -E "Thread|python|Py" | head -30; done

      # Hooks and install script of the Claude Code plugin (fixtures, no
      # network, temp HOME).
      - name: Plugin tests
        run: |
          command -v shellcheck >/dev/null || brew install shellcheck
          scripts/test-plugin.sh

      # render-homebrew.sh and the formula/cask templates (fixtures, no network).
      - name: Release script tests
        run: bash scripts/test-release-scripts.sh

      # Homebrew's own audit and install dry run on the rendered formula and
      # cask, in a throwaway tap.
      - name: Homebrew checks
        run: scripts/check-homebrew.sh

      - name: Build xcframework
        run: scripts/build-xcframework.sh

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          (cd app && xcodegen generate)

      - name: Swift tests
        run: |
          xcodebuild -project app/BalanceTonPort.xcodeproj -scheme BalanceTonPort \
            -destination 'platform=macOS' -derivedDataPath target/xcode-ci test
