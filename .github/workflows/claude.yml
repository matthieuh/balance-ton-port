name: Claude

# `@claude <request>` in a PR or issue comment, a PR review, or a new issue:
# Claude answers, reviews, or pushes a fix to the PR branch.
#
# Only the repo owner can trigger it. Anyone else's comment, a fork PR's
# content included, never starts a run, so outside text cannot steer an agent
# that holds write access. Release secrets live in the `release` environment,
# which this workflow never uses.
#
# macOS runner so Claude can run the Rust tests (libproc needs the macOS SDK).

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened]

permissions:
  contents: read

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' &&
        github.event.comment.author_association == 'OWNER' &&
        contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' &&
        github.event.comment.author_association == 'OWNER' &&
        contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' &&
        github.event.review.author_association == 'OWNER' &&
        contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' &&
        github.event.issue.author_association == 'OWNER' &&
        (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    env:
      MACOSX_DEPLOYMENT_TARGET: "14.0"
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Rust toolchain (rust-toolchain.toml)
        run: |
          rustup toolchain install
          rustup component add rustfmt clippy

      # Same as ci.yml: libproc runs bindgen.
      - name: bindgen env
        run: |
          SDKROOT="$(xcrun --sdk macosx --show-sdk-path)"
          {
            echo "SDKROOT=$SDKROOT"
            echo "BINDGEN_EXTRA_CLANG_ARGS=-isysroot $SDKROOT"
            echo "LIBCLANG_PATH=$(xcode-select -p)/Toolchains/XcodeDefault.xctoolchain/usr/lib"
          } >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - uses: anthropics/claude-code-action@61a9c274fa7110a66dfafc1bbbced03833eb25fe # v1.0.269
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          claude_args: >-
            --model claude-opus-5-5
            --max-turns 100
            --allowedTools "Bash(cargo fmt:*),Bash(cargo clippy:*),Bash(cargo test:*),Bash(cargo build:*),Bash(scripts/test-plugin.sh),Bash(bash scripts/test-release-scripts.sh),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr checks:*),Bash(gh run view:*),Bash(gh issue view:*)"
            --append-system-prompt "Follow CLAUDE.md, in particular its Safety invariants. Before pushing code, run cargo fmt, cargo clippy --all-targets -- -D warnings and cargo test, and say in your reply which ones you ran and their result. A change to the kill path needs a test that fails without it."
